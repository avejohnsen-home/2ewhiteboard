<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tavle: #fbfbf8;
    --ramme: #b9bcbf;
    --strek: #23262b;
    --tynn: #c9ccd0;
    --tekst: #1c1e22;
    --dempet: #8b8f96;
    --rod: #d93a2b;
    --teal: #13897a;
    --marker: "Permanent Marker", "Kalam", "Comic Sans MS", cursive;
    --hand: "Kalam", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 24px; }
  html, body { height: 100%; background: #e9e8e4; overflow: hidden; }
  body { color: var(--tekst); font-family: var(--hand); cursor: none; }

  #flate { width: 100vw; height: 100vh; padding: 0.7rem; transform-origin: top left; }
  body.roter #flate { width: 100vh; height: 100vw; transform: rotate(90deg) translateY(-100%); }

  /* The board with its aluminium frame */
  .tavle { height: 100%; background: var(--tavle); border: 0.45rem solid var(--ramme); border-radius: 0.35rem;
           box-shadow: inset 0 0 0 1px #9da1a5, 0 0.2rem 0.6rem rgba(0,0,0,0.15);
           display: grid; grid-template-columns: 1fr 2.7rem 26%; padding: 0.6rem 0.6rem 0.6rem 0.7rem; position: relative; }

  /* ---------- Calendar (left) ---------- */
  main { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .ukeskille { flex: 0 0 auto; font-family: var(--marker); font-size: 1rem; color: var(--teal); letter-spacing: 0.04em; padding: 0.7rem 0 0.1rem 0.15rem; border-bottom: 5px solid var(--strek); }
  .ukeskille:first-child { padding-top: 0; }
  .ukeskille .mndnavn { display: block; font-size: 1.5rem; color: var(--tekst); letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.1; margin-bottom: 0.1rem; }
  .rad { flex: 1 1 auto; display: grid; grid-template-columns: 7.6rem 2.6rem minmax(0, 1fr) minmax(0, max-content); border-bottom: 2px solid var(--strek); min-height: 0; }
  .rad > div { padding: 0.15rem 0.4rem; min-width: 0; }
  .ukedag { font-family: var(--marker); font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.02em; display: flex; align-items: center; border-right: 2px solid var(--strek); }
  .rad.helg .ukedag { color: var(--rod); }
  .nr { font-family: var(--marker); font-size: 1.35rem; display: flex; align-items: center; justify-content: center; border-right: 2px solid var(--strek); position: relative; padding-top: 0.45rem !important; }
  .nr .mnd { position: absolute; bottom: 0.05rem; right: 0.2rem; font-family: var(--hand); font-weight: 700; font-size: 0.5rem; color: var(--teal); }
  .nr .uke { position: absolute; top: 0.05rem; left: 0.2rem; font-family: var(--hand); font-weight: 700; font-size: 0.5rem; color: var(--teal); white-space: nowrap; }
  .innh { display: flex; flex-direction: column; justify-content: center; gap: 0.05rem; overflow: hidden; }
  .side { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 0.25rem; text-align: right; max-width: 7.5rem; }

  .h { font-size: 0.92rem; line-height: 1.15; display: flex; gap: 0.6rem; }
  .h .kl { font-weight: 700; flex-shrink: 0; min-width: 2.5rem; }
  .h { gap: 0.45rem; }
  .h .t { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
  .h.heldag .t { font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .ooo { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  .ooo small { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; }
  .ooo b { font-size: 0.85rem; font-weight: 700; }

  .rad.forbi { opacity: 0.3; }

  /* Red paper arrow pointing at today */
  .pil { position: absolute; left: 0; width: 2.6rem; height: 1.4rem; transform: translateY(-50%); pointer-events: none; display: none; z-index: 2; }

  /* ---------- Right column ---------- */
  aside { display: flex; flex-direction: column; gap: 0.9rem; min-height: 0; overflow: hidden; padding-left: 0.2rem; }
  .klokke .tid { font-family: var(--marker); font-size: 2.6rem; line-height: 1; }
  .klokke .dato { font-size: 0.85rem; color: var(--dempet); }

  .sb h2 { font-family: var(--marker); font-weight: 400; font-size: 1.55rem; letter-spacing: 0.04em; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; margin-bottom: 0.3rem; }
  .sb-tabell { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--strek); border-left: 2px solid var(--strek); }
  .sb-kol { border-right: 2px solid var(--strek); display: flex; flex-direction: column; }
  .sb-kol h3 { font-family: var(--marker); font-weight: 400; font-size: 1rem; text-align: center; padding: 0.2rem; border-bottom: 2px solid var(--strek); }
  .sb-rad { border-bottom: 2px solid var(--strek); padding: 0.25rem 0.3rem; font-size: 0.88rem; line-height: 1.15; min-height: 2.1rem; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .sb-rad .d { font-weight: 700; }
  .sb-rad .n { overflow-wrap: anywhere; }
  .sb-rad.forbi { color: var(--dempet); text-decoration: line-through; text-decoration-color: rgba(0,0,0,0.25); }
  .sb-rad.na { background: rgba(217,58,43,0.1); }
  .sb-rad.na::after { content: "NOW"; position: absolute; right: 0.25rem; top: 0.2rem; font-family: var(--marker); font-size: 0.55rem; color: var(--rod); }
  .sb-tom { padding: 0.3rem; font-size: 0.75rem; color: var(--dempet); border-bottom: 2px solid var(--strek); }

  .forklaring { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.75rem; }
  .forklaring span { display: flex; align-items: center; gap: 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .forklaring i { width: 1.1rem; height: 0.5rem; border-radius: 0.1rem; display: inline-block; }

  .status { margin-top: auto; font-size: 0.5rem; color: var(--dempet); }
  .status.feil { color: var(--rod); font-size: 0.7rem; }

  .oppsett { margin: auto; padding: 2rem; line-height: 1.6; background: #fff; }
  .oppsett h1 { font-size: 1.6rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<div id="flate">
  <div class="tavle" id="tavle">
    <main id="liste"></main>
    <div></div>
    <aside>
      <div class="klokke"><div class="tid" id="tid">--:--</div><div class="dato" id="dato">&nbsp;</div></div>
      <div class="sb" id="standby"></div>
      <div class="forklaring" id="forklaring"></div>
      <div class="status" id="status"></div>
    </aside>
    <svg class="pil" id="pil" viewBox="0 0 120 56" aria-hidden="true">
      <path d="M4 28 L40 4 L40 17 L114 17 L114 39 L40 39 L40 52 Z" fill="#fff" stroke="#d93a2b" stroke-width="5" stroke-linejoin="round"/>
      <path d="M48 22 L106 22" stroke="#d93a2b" stroke-width="2" opacity="0.35"/>
    </svg>
  </div>
</div>

<script>
(function () {
  const OPPDATER_SEK = 30;   // how often the calendar is fetched
  const TZ = 'Europe/Oslo';

  // Fixed colour per calendar (name must match Google Calendar)
  const FARGER = {
    'Office': '#1c1e22',
    'Fantasy': '#1f5fd1',
    'Family Entertainment': '#1f8a4c',
    'GoNordic': '#d1352b'
  };
  // Standby: events in this calendar whose title starts with "Standby"
  const STANDBY_KALENDER = 'Office';
  const STANDBY_MONSTER = /^\s*standby\b/i;
  // Out of office: events (any calendar) whose title starts with "Out of office"
  // Shown next to the day (any calendar): title prefix → label written above the name
  const SIDENOTATER = [
    { monster: /^\s*out\s+of\s+(the\s+)?office\b/i, etikett: 'Out of Office' },
    { monster: /^\s*home\s*office\b/i, etikett: 'Home Office' }
  ];

  const UKEDAG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MND = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MND_KORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ---- Settings from the URL (remembered locally) ----
  const p = new URLSearchParams(location.search);
  function lagre(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function hent(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  let id = p.get('id'), key = p.get('key');
  if (id && key) { lagre('kal_id', id); lagre('kal_key', key); }
  else { id = hent('kal_id'); key = hent('kal_key'); }
  const demo = p.has('demo');
  if (p.get('roter') === '1') document.body.classList.add('roter');

  const $ = (s) => document.getElementById(s);
  let data = null;

  // ---- Date helpers ----
  function d2s(d) { return d.toISOString().slice(0, 10); }
  function s2d(s) { return new Date(s + 'T12:00:00Z'); }
  function pluss(s, n) { const d = s2d(s); d.setUTCDate(d.getUTCDate() + n); return d2s(d); }
  function mandag(s) { const d = s2d(s); return pluss(s, -((d.getUTCDay() + 6) % 7)); }
  function ukenr(s) {
    const d = s2d(s); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);
    const y = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((d - y) / 864e5 - 3 + ((y.getUTCDay() + 6) % 7)) / 7);
  }
  function osloNa() {
    const f = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const o = {}; f.formatToParts(new Date()).forEach(x => o[x.type] = x.value);
    return { dato: `${o.year}-${o.month}-${o.day}`, tid: `${o.hour}:${o.minute}` };
  }
  function mndNokkel(s) { return s.slice(0, 7); }
  function nesteMnd(k) { let [a, m] = k.split('-').map(Number); m++; if (m > 12) { m = 1; a++; } return `${a}-${String(m).padStart(2, '0')}`; }
  function utenPrefiks(tittel, monster) { return tittel.replace(monster, '').replace(/^[\s\-–—:]+/, '').trim(); }

  // ---- Clock ----
  function tikk() {
    const n = osloNa(), d = s2d(n.dato);
    $('tid').textContent = n.tid;
    $('dato').textContent = `${UKEDAG[d.getUTCDay()]} ${d.getUTCDate()} ${MND[d.getUTCMonth()]} · Week ${ukenr(n.dato)}`;
    if (data && n.dato !== data.idag) { data.idag = n.dato; tegn(); if (mandag(n.dato) !== data.ukestart) hentData(); }
  }

  // ---- Rendering ----
  function kalNavn(i) { return (data.kalendere[i] || {}).navn || ''; }
  function farge(i) { return FARGER[kalNavn(i)] || '#555'; }
  function erStandby(h) { return kalNavn(h.kal) === STANDBY_KALENDER && STANDBY_MONSTER.test(h.tittel); }
  function sideType(h) { return SIDENOTATER.find(t => t.monster.test(h.tittel)); }
  function erOOO(h) { return !!sideType(h); }

  function tegn() {
    if (!data) return;
    const idag = data.idag, start = mandag(idag), slutt = pluss(start, 27);

    const perDag = {};
    data.hendelser.forEach(h => {
      if (erStandby(h)) return;
      let s = h.fraDato < start ? start : h.fraDato;
      const t = h.tilDato > slutt ? slutt : h.tilDato;
      while (s <= t) {
        (perDag[s] = perDag[s] || []).push({ ...h, forste: s === h.fraDato, siste: s === h.tilDato });
        s = pluss(s, 1);
      }
    });

    $('forklaring').innerHTML = data.kalendere.map((k, i) =>
      `<span><i style="background:${farge(i)}"></i>${esc(k.navn)}</span>`).join('');

    let html = '';
    for (let n = 0; n < 28; n++) {
      const dag = pluss(start, n), d = s2d(dag), wd = d.getUTCDay();
      const alle = perDag[dag] || [];
      const vanlige = alle.filter(h => !erOOO(h)).sort(sorter);
      const ooo = alle.filter(erOOO).sort((a, b) => a.tittel.localeCompare(b.tittel));
      const kl = ['rad'];
      if (wd === 0 || wd === 6) kl.push('helg');
      if (dag < idag) kl.push('forbi');
      if (dag === idag) kl.push('idag');
      if (n % 7 === 0) {
        // Month name above the week whose Monday starts a new month (and above the first week)
        const nyMnd = n === 0 || mndNokkel(dag) !== mndNokkel(pluss(dag, -7));
        const mndNavn = nyMnd ? `<span class="mndnavn">${MND[d.getUTCMonth()]}</span>` : '';
        html += `<div class="ukeskille">${mndNavn}Week ${ukenr(dag)}</div>`;
      }
      const uke = '';
      const mnd = (d.getUTCDate() === 1 || n === 0) ? `<span class="mnd">${MND_KORT[d.getUTCMonth()]}</span>` : '';
      html += `<div class="${kl.join(' ')}" data-dag="${dag}">
        <div class="ukedag">${UKEDAG[wd]}</div>
        <div class="nr">${uke}${d.getUTCDate()}${mnd}</div>
        <div class="innh">${vanlige.map(hendelse).join('')}</div>
        <div class="side">${ooo.map(oooTekst).join('')}</div>
      </div>`;
    }
    $('liste').innerHTML = html;
    tegnStandby();
    tilpass();
  }

  function sorterTid(h) { return h.heldag ? '00:00' : (h.forste ? h.fraTid : '00:00'); }
  function sorter(a, b) {
    if (a.heldag !== b.heldag) return a.heldag ? -1 : 1;
    return sorterTid(a).localeCompare(sorterTid(b)) || a.tittel.localeCompare(b.tittel);
  }
  function klokkeslett(h) {
    if (h.heldag) return '';
    if (h.forste) return h.fraTid;
    if (h.siste) return `–${h.tilTid}`;
    return '';
  }
  function hendelse(h) {
    const kl = klokkeslett(h);
    return `<div class="h${h.heldag ? ' heldag' : ''}" style="color:${farge(h.kal)}">${kl ? `<span class="kl">${kl}</span>` : ''}<span class="t">${esc(h.tittel)}</span></div>`;
  }
  // "Out of Office - Linda 10:30" → "Linda 10:30" (no calendar time shown)
  function oooTekst(h) {
    const type = sideType(h);
    const rest = utenPrefiks(h.tittel, type.monster);
    return `<div class="ooo" style="color:${farge(h.kal)}"><small>${type.etikett}</small><b>${esc(rest)}</b></div>`;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ---- Standby (two months side by side, like the board) ----
  function standbyListe() {
    if (Array.isArray(data.standby)) return data.standby.slice();
    return data.hendelser.filter(erStandby).map(h => ({ navn: utenPrefiks(h.tittel, STANDBY_MONSTER), fraDato: h.fraDato, tilDato: h.tilDato }));
  }
  function tegnStandby() {
    const idag = data.idag, m1 = mndNokkel(idag), m2 = nesteMnd(m1);
    const liste = standbyListe().sort((a, b) => a.fraDato.localeCompare(b.fraDato));
    const slatt = [];
    liste.forEach(s => {
      const f = slatt[slatt.length - 1];
      if (f && f.navn.toLowerCase() === s.navn.toLowerCase() && s.fraDato <= pluss(f.tilDato, 1)) {
        if (s.tilDato > f.tilDato) f.tilDato = s.tilDato;
      } else slatt.push({ ...s });
    });
    const grupper = { [m1]: [], [m2]: [] };
    slatt.forEach(s => {
      let k = mndNokkel(s.fraDato);
      if (k < m1 && s.tilDato >= m1 + '-01') k = m1;
      if (grupper[k]) grupper[k].push(s);
    });
    const kol = k => {
      let h = `<div class="sb-kol"><h3>${MND_KORT[Number(k.slice(5, 7)) - 1]}</h3>`;
      if (!grupper[k].length) h += '<div class="sb-tom">—</div>';
      grupper[k].forEach(s => {
        const kl = ['sb-rad'];
        if (s.tilDato < idag) kl.push('forbi'); else if (s.fraDato <= idag) kl.push('na');
        h += `<div class="${kl.join(' ')}"><span class="d">${dagerTekst(s)}</span><span class="n">${esc(s.navn || '?')}</span></div>`;
      });
      return h + '</div>';
    };
    $('standby').innerHTML = `<h2>STAND BY</h2><div class="sb-tabell">${kol(m1)}${kol(m2)}</div>`;
  }
  function dagerTekst(s) {
    const dager = [];
    for (let d = s.fraDato; d <= s.tilDato && dager.length < 32; d = pluss(d, 1)) dager.push(s2d(d).getUTCDate());
    return dager.length <= 2 ? dager.join('/') : `${dager[0]}–${dager[dager.length - 1]}`;
  }

  // Fit everything on screen, then place the red arrow at today's row
  function tilpass() {
    const el = $('liste'), root = document.documentElement;
    const aside = document.querySelector('aside');
    let fs = Math.min(30, $('flate').offsetWidth / 40);
    root.style.fontSize = fs + 'px';
    const forMye = () => el.scrollHeight > el.clientHeight + 1 || aside.scrollHeight > aside.clientHeight + 1 ||
      [...el.querySelectorAll('.innh, .side')].some(c => c.scrollHeight > c.clientHeight + 1);
    while (forMye() && fs > 9) { fs -= 0.5; root.style.fontSize = fs + 'px'; }
    plasserPil();
  }
  function plasserPil() {
    const pil = $('pil'), rad = document.querySelector('.rad.idag'), main = $('liste');
    if (!rad) { pil.style.display = 'none'; return; }
    pil.style.display = 'block';
    pil.style.left = (main.offsetLeft + main.offsetWidth + 2) + 'px';
    pil.style.top = (rad.offsetTop + rad.offsetHeight / 2) + 'px';
  }

  // ---- Fetching ----
  async function hentData() {
    try {
      if (demo) data = demoData();
      else {
        const url = `https://script.google.com/macros/s/${encodeURIComponent(id)}/exec?key=${encodeURIComponent(key)}&t=${Date.now()}`;
        const r = await fetch(url, { cache: 'no-store' });
        const j = await r.json();
        if (j.feil) throw new Error(j.feil);
        data = j;
      }
      data.idag = osloNa().dato;
      tegn();
      $('status').className = 'status';
      $('status').textContent = 'Updated ' + osloNa().tid;
    } catch (e) {
      $('status').className = 'status feil';
      $('status').textContent = "Can't reach the calendar – retrying" + (data ? ' (showing last known data)' : '');
      console.warn(e);
    }
  }

  function demoData() {
    const m = mandag(osloNa().dato);
    const kal = [{ navn: 'Office' }, { navn: 'Fantasy' }, { navn: 'Family Entertainment' }, { navn: 'GoNordic' }];
    const H = (d, k, t, fra, til, hel, dager) => ({ tittel: t, sted: '', kal: k, heldag: !!hel,
      fraDato: pluss(m, d), fraTid: hel ? '' : fra, tilDato: pluss(m, d + (dager || 0)), tilTid: hel ? '' : til });
    const navn = ['Robin', 'Adrian', 'Ave', 'Linda'];
    const standby = [];
    for (let w = -4; w < 10; w++) standby.push({ navn: navn[(w + 12) % 4], fraDato: pluss(m, w * 7 + 5), tilDato: pluss(m, w * 7 + 6) });
    return { ukestart: m, kalendere: kal, standby, hendelser: [
      H(0, 0, '11:00 Marlene quit', '11:00', '12:00'), H(0, 0, 'Out of Office - Robin', '08:00', '16:00'),
      H(1, 0, 'Ingvild', '09:00', '10:00'), H(1, 3, 'Out of office - Adrian meeting TLK', '09:00', '15:00'),
      H(2, 0, 'Prep meeting', '10:00', '11:00'), H(3, 0, 'CL Tender meeting', '12:00', '14:00'),
      H(4, 0, 'IL + Ave – Planday meeting', '13:00', '14:00'), H(4, 0, 'Out of Office - Linda 10:30–14', '10:30', '14:00'),
      H(7, 1, 'XFA – EM on', '09:00', '10:00'), H(9, 2, 'Out of office - Ave off', '', '', true),
      H(11, 1, 'Clara premiere', '12:00', '15:00'), H(13, 1, 'Cost arrival 27', '', '', true),
      H(14, 3, 'Rehearsal start 27 – Adrian Crown', '11:00', '15:00'), H(15, 0, 'Results meeting', '14:00', '15:00'),
      H(17, 0, 'Ave haircut', '', '', true), H(18, 0, 'Waffle Friday ♡', '12:00', '13:00'),
      H(20, 2, 'Fam. Ent. music draft', '', '', true), H(24, 0, 'Deadline salaries', '', '', true),
      H(25, 0, 'Out of Office - LS office 10:30', '10:30', '16:00'), H(2, 0, 'Home Office - Robin', '', '', true), H(4, 2, 'Home Office - Adrian', '08:00', '16:00')
    ] };
  }

  // ---- Start ----
  if (!demo && (!id || !key)) {
    $('flate').innerHTML = `<div class="oppsett"><h1>Calendar – setup</h1>
      <p>Open this page with <code>?id=DEPLOYMENT-ID&amp;key=KEY</code></p>
      <p>Just want a preview? Add <code>?demo</code></p></div>`;
    return;
  }
  tikk(); setInterval(tikk, 1000);
  hentData(); setInterval(hentData, OPPDATER_SEK * 1000);
  window.addEventListener('resize', tilpass);
  if (document.fonts) document.fonts.ready.then(tilpass);
  setInterval(() => { if (osloNa().tid === '04:00') location.reload(); }, 60 * 1000);
})();
</script>
</body>
</html>
